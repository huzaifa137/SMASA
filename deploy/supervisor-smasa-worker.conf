; Keeps the queue workers running. Copy to /etc/supervisor/conf.d/, edit the
; paths and user, then:  sudo supervisorctl reread && sudo supervisorctl update
;
; Three queues, in priority order: notifications (gate-scan parent alerts and
; push) first, then report cards, then everything else.
[program:smasa-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/smasa/artisan queue:work redis --queue=notifications,reports,default --sleep=2 --tries=2 --max-time=3600 --memory=256
directory=/var/www/smasa
user=www-data
numprocs=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=900
redirect_stderr=true
stdout_logfile=/var/log/smasa-worker.log
